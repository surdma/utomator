apiVersion: "utomator.dev/v1"
kind: "GrowthBlueprintWorkflow"
metadata:
  id: "linkedin-jobs"
  version: 1
  title: "Job search & career opportunity pipeline"
spec:
  platform: "linkedin"
  objective: "From job evidence and factual fit scoring to owner-submitted applications and outcomes."
  requirements:
    requirement01: "Review the owner goal and source evidence before action"
    requirement02: "Complete actions manually when provider operations are unavailable"
  coverage:
    evidence: "Owner-supplied evidence and source links"
    outcome: "Reviewed decisions, missing data and next steps"
  pipelines:
    discovery:
      title: "Evidence and preparation"
      dependsOn: "none"
      tasks:
        todo: "Define target roles, adjacent careers, industries and companies"
        procedure: "Record legitimate openings, requirements and source URLs"
        action: "Match actual qualifications and identify missing skills"
        event: "Align resume, portfolio and LinkedIn profile for a specific vacancy"
        verify: "Prepare applications, cover letters and interview evidence"
    review:
      title: "Review and owner handoff"
      dependsOn: "discovery"
      tasks:
        todo: "Align resume, portfolio and LinkedIn profile for a specific vacancy"
        procedure: "Prepare applications, cover letters and interview evidence"
        action: "Track saved, applied, interviewing, rejected, offer and accepted states"
        event: "Draft recruiter introductions and respectful follow-ups"
        verify: "Measure application-to-interview and offer outcomes"
