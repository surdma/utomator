apiVersion: "utomator.dev/v1"
kind: "GrowthProfileWorkflow"
metadata:
  id: "linkedin-profile"
  version: 1
  title: "Profile auditing & section optimization"
spec:
  platform: "linkedin"
  objective: "Improve a real professional profile with verified evidence and owner-approved changes"
  requirements:
    requirement01: "Assess every supported profile section independently using a transparent rubric"
    requirement02: "Review photo framing, banner hierarchy, name and pronunciation accuracy"
    requirement03: "Audit and rewrite headline, About, Experience, Education and Featured"
    requirement04: "Review Skills, Recommendations, Certifications, Projects and Publications"
    requirement05: "Review volunteering, honors, Services, contact links and custom URL"
    requirement06: "Check job preferences, verification options and career-specific keywords"
    requirement07: "Compare original versus proposed claims; reject fabricated achievements"
    requirement08: "Provide role-specific headline/About variations and prioritized improvements"
    requirement09: "Preserve drafts, change history and verified post-edit reassessment"
  coverage:
    profilePhoto: "Profile photo"
    banner: "Banner / cover"
    fullName: "Full name and pronunciation"
    headline: "Headline"
    about: "About"
    experience: "Experience"
    education: "Education"
    featured: "Featured"
    skills: "Skills"
    recommendations: "Recommendations"
    certifications: "Certifications"
    projects: "Projects"
    publications: "Publications"
    volunteering: "Volunteering"
    honors: "Honors and awards"
    services: "Services"
    contact: "Contact information"
    customUrl: "Custom profile URL"
    careerPreferences: "Career preferences"
    verification: "Profile verification"
  pipelines:
    baseline: "audit"
    sectionInspection: "audit-page"
    positioning: "edit-profile"
    skills: "add-skill"
    experience: "edit-experience"
    contact: "edit-website"
    services: "edit-services"
    projects: "add-project"
    featured: "add-featured"
