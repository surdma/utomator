apiVersion: "utomator.dev/v1"
kind: "GrowthBlueprintWorkflow"
metadata:
  id: "linkedin-network"
  version: 1
  title: "Audience & professional network development"
spec:
  platform: "linkedin"
  objective: "Grow relevant professional relationships rather than maximize connection totals."
  requirements:
    requirement01: "Review the owner goal and source evidence before action"
    requirement02: "Complete actions manually when provider operations are unavailable"
  coverage:
    evidence: "Owner-supplied evidence and source links"
    outcome: "Reviewed decisions, missing data and next steps"
  pipelines:
    discovery:
      title: "Evidence and preparation"
      dependsOn: "none"
      tasks:
        todo: "Define ideal followers and high-value professional audiences"
        procedure: "Research peers, recruiters, collaborators and relevant communities"
        action: "Prioritize shared interests and authentic introduction opportunities"
        event: "Draft personalized connection notes for owner delivery"
        verify: "Track manually sent invitations and replies"
    review:
      title: "Review and owner handoff"
      dependsOn: "discovery"
      tasks:
        todo: "Prioritize shared interests and authentic introduction opportunities"
        procedure: "Draft personalized connection notes for owner delivery"
        action: "Track manually sent invitations and replies"
        event: "Maintain relationship context and sensible follow-ups"
        verify: "Compare meaningful relationships with raw network size"
