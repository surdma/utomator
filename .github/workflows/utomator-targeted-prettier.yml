name: Utomator targeted Prettier review

on:
  push:
    branches: [feat/yaml-growth-profile-pipeline]
    paths:
      - ".github/workflows/utomator-targeted-prettier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Produce exact Prettier output without committing
        run: |
          pnpm exec prettier --write apps/frontend/components/automate/pipeline/run-history.tsx apps/frontend/components/automate/pipeline/run-tracking-dialog.tsx
      - name: Export formatted files for review
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, base64, hashlib
          for name in (
              "apps/frontend/components/automate/pipeline/run-history.tsx",
              "apps/frontend/components/automate/pipeline/run-tracking-dialog.tsx",
          ):
              data = pathlib.Path(name).read_bytes()
              print(f"PRETTIER_START:{name}:{len(data)}:{hashlib.sha256(data).hexdigest()}", flush=True)
              encoded = base64.b64encode(data).decode("ascii")
              for offset in range(0, len(encoded), 2000):
                  print(f"PRETTIER_CHUNK:{name}:{offset // 2000}:{encoded[offset:offset+2000]}", flush=True)
              print(f"PRETTIER_END:{name}", flush=True)
          PY
