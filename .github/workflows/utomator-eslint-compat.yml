name: Repair frontend ESLint dependency

on:
  push:
    branches: [feat/yaml-growth-profile-pipeline]
    paths: ['.github/workflows/utomator-eslint-compat.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eslint-compat:
    if: github.repository == 'surdma/utomator' && github.ref == 'refs/heads/feat/yaml-growth-profile-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yaml-growth-profile-pipeline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align ESLint major with current React plugin
        run: pnpm --filter @utomator/frontend add --save-dev eslint@9.39.1
      - name: Verify lockfile and ESLint config can load
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @utomator/frontend exec eslint --version
          pnpm --filter @utomator/frontend exec eslint --print-config app/page.tsx > /tmp/eslint-configuration.json
          test -s /tmp/eslint-configuration.json
      - name: Verify existing frontend behavior and type contracts
        run: |
          pnpm --filter @utomator/frontend test
          pnpm --filter @utomator/frontend build
          pnpm --filter @utomator/frontend exec tsc --noEmit
      - name: Push validated dependency changes
        run: |
          git diff --check
          git add apps/frontend/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No dependency changes'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(frontend): Pin compatible ESLint major and lockfile'
          git fetch origin feat/yaml-growth-profile-pipeline
          git rebase origin/feat/yaml-growth-profile-pipeline
          git push origin HEAD:feat/yaml-growth-profile-pipeline
