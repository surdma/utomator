name: Utomator code quality

on:
  pull_request:
    branches: [main, feat/unified-linkedin-growth-workspace, work/mator-e2e-tracked-20261101]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/utomator-code-quality.yml"
  push:
    branches: [main, feat/yaml-growth-profile-pipeline, work/mator-unified-artboard-pr15-20261103]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: utomator-code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-format-and-lint:
    name: Backend Biome formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify backend formatting
        id: backend-format
        run: pnpm --filter @utomator/backend exec biome format --max-diagnostics=200 .
      - name: Verify backend lint, including warnings
        if: ${{ !cancelled() && steps.backend-format.outcome != 'skipped' }}
        run: pnpm --filter @utomator/backend exec biome lint --error-on-warnings .

  frontend-format-and-lint:
    name: Frontend Biome formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify frontend formatting
        id: frontend-format
        run: pnpm --filter @utomator/frontend exec biome format --max-diagnostics=200 .
      - name: Verify frontend Biome lint, including warnings
        if: ${{ !cancelled() && steps.frontend-format.outcome != 'skipped' }}
        run: pnpm --filter @utomator/frontend exec biome lint --error-on-warnings .

  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@v2
        with:
          directory: apps/frontend
          scope: full
          blocking: warning
