name: Utomator integration

on:
  pull_request:
    branches: [main, work/mator-e2e-tracked-20261101]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/utomator-integration.yml"
  push:
    branches: [main, feat/yaml-growth-profile-pipeline, work/mator-unified-artboard-pr15-20261103]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: utomator-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify React Flow stylesheet is installed
        run: |
          pnpm --filter @utomator/frontend exec node -e "const path = require('path'); const fs = require('fs'); const pkg = require.resolve('@xyflow/react/package.json'); if (!fs.existsSync(path.join(path.dirname(pkg),'dist','style.css'))) process.exit(1); console.log('React Flow stylesheet resolved');"
      - name: Verify migrated frontend routes
        run: pnpm --filter @utomator/frontend test
      - name: Unit and Fastify route tests
        run: pnpm --filter @utomator/backend test
      - name: TypeScript and Biome
        run: |
          pnpm --filter @utomator/backend typecheck
          pnpm --filter @utomator/backend lint
      - name: Compile Utomator
        run: pnpm --filter @utomator/backend build
      - name: Frontend production build
        run: pnpm --filter @utomator/frontend build
      - name: Type-check frontend
        run: pnpm --filter @utomator/frontend exec tsc --noEmit
      - name: Install test Chromium
        run: pnpm --filter @utomator/backend exec playwright install --with-deps chromium
      - name: Initialize local SQLite schema
        run: pnpm --filter @utomator/backend db:push
      - name: Verify hosted OIDC, gateway security and isolated Fastify workers
        run: pnpm --filter @utomator/backend test:hosted
      - name: Confirm automation server stays alive after startup
        run: node scripts/check-utomator-lifecycle.mjs
      - name: Start frontend for shared automation workspace tests
        run: |
          pnpm --filter @utomator/frontend exec next start -p 3100 > /tmp/automate-frontend.log 2>&1 &
          echo $! > /tmp/automate-frontend.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/automate-frontend.log
          exit 1
      - name: Real browser + local fixture integration tests
        run: pnpm --filter @utomator/backend test:integration
        env:
          NODE_ENV: test
          HEADLESS: "true"
      - name: Frontend connection browser regression tests
        run: pnpm --filter @utomator/frontend exec playwright test tests/connector-states.test.ts tests/connector-sync.test.ts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      - name: Upload local mock-browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: utomator-mock-evidence
          path: apps/backend/.runtime/evidence/
          retention-days: 3
          if-no-files-found: ignore

  artboard-typecheck:
    name: Unified Artboard typecheck and focused unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - name: Type-check frontend without legacy test dependencies
        run: pnpm --filter @utomator/frontend typecheck
      - name: Check Growth graph and Runner journal behavior
        run: >-
          pnpm --filter @utomator/frontend exec vitest run
          tests/growth-graph-model.test.mjs tests/growth-run-journal.test.mjs
          tests/default-workflow-plan.test.mjs
      - name: Check unified Artboard route contract
        run: >-
          pnpm --filter @utomator/frontend exec vitest run
          tests/utomator-routes.test.mjs
          -t "Growth YAML uses the persistent Artboard canvas|the first visit shows a blank Artboard"

      - name: Capture formatting for staged-action bridge (diagnostic only)
        if: always()
        run: |
          pnpm --filter @utomator/frontend exec biome format --write \
            components/dashboard/dashboard-shell.tsx \
            components/dashboard/pipeline/use-operator-commands.ts \
            components/dashboard/pipeline/use-workflow-workspace.ts \
            tests/utomator-routes.test.mjs
          echo 'ACTION_BRIDGE_FORMAT_BEGIN'
          git diff -- \
            apps/frontend/components/dashboard/dashboard-shell.tsx \
            apps/frontend/components/dashboard/pipeline/use-operator-commands.ts \
            apps/frontend/components/dashboard/pipeline/use-workflow-workspace.ts \
            apps/frontend/tests/utomator-routes.test.mjs
          echo 'ACTION_BRIDGE_FORMAT_END'

  artboard-browser:
    name: Unified Artboard real-browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter @utomator/frontend build
      - name: Install Chromium
        run: pnpm --filter @utomator/backend exec playwright install --with-deps chromium
      - name: Initialize local SQLite schema
        run: pnpm --filter @utomator/backend db:push
      - name: Start local frontend for Artboard scenarios
        run: |
          pnpm --filter @utomator/frontend exec next start -p 3100 > /tmp/artboard-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/artboard-frontend.log
          exit 1
      - name: Exercise executable and design-only Growth YAML in the original Artboard
        run: >-
          pnpm --filter @utomator/backend exec vitest run --config vitest.integration.config.ts
          tests/browser.integration.test.ts
          -t "Growth profile YAML uses one Artboard|planning-only Growth YAML stays read-only|blank Artboard opens action templates"
        env:
          NODE_ENV: test
          HEADLESS: "true"
      - name: Print frontend logs if the Artboard validation fails
        if: failure()
        run: cat /tmp/artboard-frontend.log || true

  frontend-ui-quality:
    name: Frontend responsive and accessibility quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production frontend
        run: pnpm --filter @utomator/frontend build
      - name: Install Chromium and WebKit browser dependencies
        run: pnpm --filter @utomator/frontend exec playwright install --with-deps chromium webkit
      - name: Start built frontend
        run: |
          pnpm --filter @utomator/frontend exec next start -p 3100 > /tmp/utomator-ui-quality.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/utomator-ui-quality.log
          exit 1
      - name: Responsive, touch, keyboard and WCAG browser tests
        run: pnpm --filter @utomator/frontend exec playwright test tests/frontend-quality.test.ts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      - name: Preserve frontend browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui-quality-evidence
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Print frontend server logs after failure
        if: failure()
        run: cat /tmp/utomator-ui-quality.log || true
